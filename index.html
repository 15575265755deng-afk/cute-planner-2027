<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>2027 暖冬手帐 · Christmas Days</title>
<meta name="theme-color" content="#e8e4db">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="capT" class="cap"></div>
<div id="app">
  <div id="tips">点封面打开 · 点挂件或铃铛会响 · 拖动背景转视角 · 拖动页面翻页 · 点日期直接写 · 拖贴纸到任意位置 · 拖出本子就撕掉 · 滚轮缩放贴纸</div>
  <div id="scene"><div id="view">
    <div id="fshadow"></div>
    <div id="book" class="closed">
      <div id="back" class="pvc"></div>
      <div id="stack"></div>
      <div id="sheets"></div>
      <div id="cover">
        <div class="cf pvc" data-p="cv">
          <div class="stitch"></div><div class="peek"></div>
          <div class="strip"></div><div class="pocket"></div><div class="spine"></div>
          <img class="art" src="assets/cover-art.svg" alt="">
          <div class="ctitle">
            <div class="kicker">·  2027  ·</div>
            <div class="foil">暖冬</div>
            <div class="sub">CHRISTMAS DAYS</div>
          </div>
          <div class="quote">把冬天轻轻收进这一本</div>
          <div class="yr">MERRY &amp; SOFT</div>
          <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
          <div class="band"></div><div class="gloss"></div><div class="shimmer"></div><div class="sl"></div>
        </div>
        <div class="cb pvc">
          <div class="pocket"></div>
          <div class="card">cocoa,<br>quiet nights<br>&amp; gold light</div>
          <div class="gloss"></div>
        </div>
      </div>
      <div id="rings"></div>
      <div id="charm"><div class="swing"><div class="idle"><div class="chain"></div>
        <div class="acrylic"><span class="hole"></span><img src="stickers/e2.png" alt="">
          <div id="bell"><svg viewBox="0 0 40 44"><defs><radialGradient id="bg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#f1c45a"/><stop offset="1" stop-color="#b9822a"/></radialGradient></defs>
            <circle cx="20" cy="5" r="3.2" fill="none" stroke="#c99a3a" stroke-width="2"/><path d="M6 32c0-14 5-24 14-24s14 10 14 24l3 4H3z" fill="url(#bg)" stroke="#a87424" stroke-width="1.2"/><circle cx="20" cy="38" r="4" fill="#b9822a"/><path d="M11 20c1-5 3-8 6-9" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".7"/></svg></div>
        </div></div></div></div>
    </div>
  </div></div>
  <div class="ui st" id="stripA"></div>
  <div class="ui st" id="stripB"></div>
  <div class="ui" id="count"><div class="pocket" title="点一下抽一张"><div class="ptab">圣诞贴纸</div><div class="peeks"></div></div>
    <div class="card"><div class="hint">collect a soft winter ♥</div><div class="lbl">STICKERS</div><div class="num" id="num">0</div></div></div>
  <div class="ui st" id="panel"><div class="hd" id="phd">圣诞 · 限定</div><div class="gr" id="pgr"></div></div>
  <div id="btns"><button class="bt" id="bOpen">打开封面</button><button class="bt r" id="bPrev">‹</button><button class="bt r" id="bNext">›</button><button class="bt r" id="bBell" title="摇铃">🔔</button><button class="bt" id="bUI">收起贴纸栏</button></div>
  <div id="toast"></div>
</div>
<div id="capB" class="cap"></div>
<div id="ghost"><img alt=""></div>
<div id="finger"></div>
<script src="app.js"></script>
</body>
</html>
